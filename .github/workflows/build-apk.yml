name: "Build Cloud CSM APK"

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Generic Debug APK
        run: |
          {
            echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
            echo "kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
            echo "org.gradle.workers.max=2"
          } >> gradle.properties
          ./gradlew assembleGenericDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-CSM-Android-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
